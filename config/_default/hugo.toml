# -- Site Configuration --
# Refer to the theme docs for more details about each of these parameters.
# https://blowfish.page/docs/getting-started/

theme = "blowfish"
baseURL = "https://sunset0916.net"
defaultContentLanguage = "ja"

# pluralizeListTitles = true

enableRobotsTXT = true
summaryLength = 0

buildDrafts = false
buildFuture = false

timeout = "120s"

enableEmoji = true

[services.googleAnalytics]
  id = "G-FZ0WMHW80T"

[pagination]
  pagerSize = 10

[permalinks.page]
  blog = "/:section/:year/:month/:day/:contentbasename/"

[permalinks.term]
  blog = "/:section/:year/:month/:day/:contentbasename/"

[imaging]
  anchor = 'Center'

[taxonomies]
  tag = "tags"
  category = "categories"

[sitemap]
  changefreq = 'daily'
  filename = 'sitemap.xml'
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]

[related]
  threshold = 0
  toLower = false

    [[related.indices]]
        name = "tags"
        weight = 100

    [[related.indices]]
        name = "categories"
        weight = 100

    [[related.indices]]
        name = "date"
        weight = 10

    [[related.indices]]
      applyFilter = false
      name = 'fragmentrefs'
      type = 'fragments'
      weight = 10
